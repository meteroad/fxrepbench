[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxrepbench"
version = "0.1.0"
description = "An extensible benchmark suite for audio-effect representations"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Xinlu Liu"},
  {name = "Huibin Lin"},
  {name = "Zhenhai Yan"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.optional-dependencies]
reference = [
  "auraloss==0.4.0",
  "numpy>=1.26,<3",
  "pedalboard==0.9.23",
  "pyloudnorm>=0.1.1,<1",
  "soundfile>=0.12,<1",
  "torch==2.1.2",
  "torchaudio==2.1.2",
]
baselines = [
  "cma==4.4.4",
  "numpy>=1.26,<3",
]

[project.scripts]
fxrepbench = "fxrepbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fxrepbench = ["py.typed"]
